<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle da Obra</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
}

.header{
    background:#111827;
    color:white;
    padding:22px;
    text-align:center;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.cards{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:white;
    padding:22px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h3{
    color:#6b7280;
    font-size:14px;
}

.valor{
    font-size:30px;
    font-weight:700;
    color:#16a34a;
    margin-top:8px;
}

.box{
    background:white;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.box h2{
    margin-bottom:15px;
}

.linha{
    display:flex;
    gap:12px;
}

.campo{
    flex:1;
    margin-bottom:12px;
}

.campo label{
    display:block;
    font-weight:600;
    font-size:14px;
    margin-bottom:6px;
    color:#374151;
}

.campo input,
.campo select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #d1d5db;
}

.input-moeda{
    display:flex;
    border:1px solid #d1d5db;
    border-radius:12px;
    overflow:hidden;
}

.input-moeda span{
    background:#f3f4f6;
    padding:14px;
    font-weight:600;
}

.input-moeda input{
    border:none;
    width:100%;
    padding:14px;
}

.total-preview{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#ecfdf5;
    border:1px solid #bbf7d0;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
}

.total-preview strong{
    color:#16a34a;
    font-size:20px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
}

.btn-salvar{
    background:#16a34a;
    color:white;
}

.admin{
    margin-bottom:15px;
}

.admin button{
    margin-top:10px;
    background:#111827;
    color:white;
}

.item{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:12px;
    border:1px solid #e5e7eb;
}

.item-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.produto{
    font-weight:700;
}

.total{
    color:#16a34a;
    font-weight:700;
}

.info{
    color:#6b7280;
    margin-top:5px;
    font-size:14px;
}

.acoes{
    display:none;
    gap:10px;
    margin-top:12px;
}

.btn-excluir{
    background:#dc2626;
    color:white;
    padding:10px;
    border:none;
    border-radius:10px;
}

canvas{
    width:100% !important;
    max-height:300px;
}

@media(max-width:700px){
    .linha,
    .cards{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="header">
<h1>🏗 Controle da Obra</h1>
</div>

<div class="container">

<div class="cards">
    <div class="card">
        <h3>TOTAL GASTO</h3>
        <div class="valor" id="totalGeral">R$ 0,00</div>
    </div>

    <div class="card">
        <h3>QUANTIDADE DE LANÇAMENTOS</h3>
        <div class="valor" id="qtdGastos">0</div>
    </div>
</div>

<div class="admin">
    <label>
        <input type="checkbox" id="modoEdicao">
        Habilitar edição
    </label>
</div>

<div class="box">
<h2>➕ Novo Gasto</h2>

<div class="linha">
    <div class="campo">
        <label>Produto</label>
        <input id="produto" type="text">
    </div>

    <div class="campo">
        <label>Quantidade</label>
        <input id="quantidade" type="number" value="1">
    </div>
</div>

<div class="linha">
    <div class="campo">
        <label>Categoria</label>
        <select id="categoria">
            <option value="">Selecione</option>
            <option>Material</option>
            <option>Mão de Obra</option>
            <option>Elétrica</option>
            <option>Hidráulica</option>
            <option>Terraplanagem</option>
            <option>Concreto</option>
            <option>Ferragens</option>
            <option>Taxas</option>
        </select>
    </div>

    <div class="campo">
        <label>Fornecedor</label>
        <input id="fornecedor" type="text">
    </div>
</div>

<div class="campo">
    <label>Valor Unitário</label>
    <div class="input-moeda">
        <span>R$</span>
        <input id="valor" type="number" step="0.01">
    </div>
</div>

<div class="campo">
    <label>Observação</label>
    <input id="obs" type="text">
</div>

<div class="total-preview">
    <span>Total</span>
    <strong id="totalItem">R$ 0,00</strong>
</div>

<button class="btn-salvar" onclick="salvarGasto()">Salvar Gasto</button>
</div>

<div class="box">
<h2>📊 Gastos por Categoria</h2>
<canvas id="grafico"></canvas>
</div>

<div class="box">
<h2>📋 Gastos</h2>
<div id="lista"></div>
</div>

</div>

<script>
const supabaseUrl = "https://sncqakvwubhlckncuuea.supabase.co";

const supabaseKey = "sb_publishable_4oEt-DgvoHZIlzwhlppjkQ_3NuY-UBn";

const banco = window.supabase.createClient(supabaseUrl, supabaseKey);

let grafico;

function moeda(valor){
    return Number(valor || 0).toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });
}

const qtd = document.getElementById("quantidade");
const val = document.getElementById("valor");
const totalItem = document.getElementById("totalItem");

function calcularPreview(){
    const total = (Number(qtd.value) || 0) * (Number(val.value) || 0);
    totalItem.innerText = moeda(total);
}

qtd.addEventListener("input", calcularPreview);
val.addEventListener("input", calcularPreview);
calcularPreview();

document.getElementById("modoEdicao").addEventListener("change", function(){
    document.querySelectorAll(".acoes").forEach(a=>{
        a.style.display = this.checked ? "flex" : "none";
    });
});

async function salvarGasto(){

    const produto = document.getElementById("produto").value;
    const quantidade = Number(document.getElementById("quantidade").value);
    const categoria = document.getElementById("categoria").value;
    const fornecedor = document.getElementById("fornecedor").value;
    const valorUnitario = Number(document.getElementById("valor").value);
    const observacao = document.getElementById("obs").value;

    if(!produto || !quantidade || !valorUnitario){
        alert("Preencha produto, quantidade e valor unitário.");
        return;
    }

    const valorTotal = quantidade * valorUnitario;

    const { error } = await banco
        .from("gastos")
        .insert([{
            produto: produto,
            quantidade: quantidade,
            categoria: categoria,
            fornecedor: fornecedor,
            valor_unitario: valorUnitario,
            valor_total: valorTotal,
            observacao: observacao,
            data_gasto: new Date().toISOString().split("T")[0]
        }]);

    if(error){
        alert("Erro ao salvar: " + error.message);
        console.log(error);
        return;
    }

    document.getElementById("produto").value = "";
    document.getElementById("quantidade").value = "1";
    document.getElementById("categoria").value = "";
    document.getElementById("fornecedor").value = "";
    document.getElementById("valor").value = "";
    document.getElementById("obs").value = "";

    calcularPreview();
    carregarGastos();
}

async function carregarGastos(){

    const { data, error } = await banco
        .from("gastos")
        .select("*")
        .order("id", { ascending:false });

    if(error){
        alert("Erro ao carregar: " + error.message);
        console.log(error);
        return;
    }

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    let totalGeral = 0;
    let porCategoria = {};

    data.forEach(gasto => {

        totalGeral += Number(gasto.valor_total || 0);

        const categoria = gasto.categoria || "Sem categoria";

        if(!porCategoria[categoria]){
            porCategoria[categoria] = 0;
        }

        porCategoria[categoria] += Number(gasto.valor_total || 0);

        lista.innerHTML += `
        <div class="item">
            <div class="item-top">
                <div class="produto">${gasto.produto}</div>
                <div class="total">${moeda(gasto.valor_total)}</div>
            </div>

            <div class="info">
                Categoria: ${categoria}
            </div>

            <div class="info">
                Qtd: ${gasto.quantidade} | Unitário: ${moeda(gasto.valor_unitario)}
            </div>

            <div class="info">
                Fornecedor: ${gasto.fornecedor || "-"}
            </div>

            <div class="info">
                Obs: ${gasto.observacao || "-"}
            </div>

            <div class="info">
                Data: ${gasto.data_gasto || "-"}
            </div>

            <div class="acoes">
                <button class="btn-excluir" onclick="excluirGasto(${gasto.id})">
                    Excluir
                </button>
            </div>
        </div>
        `;
    });

    document.getElementById("totalGeral").innerText = moeda(totalGeral);
    document.getElementById("qtdGastos").innerText = data.length;

    atualizarGrafico(porCategoria);

    if(document.getElementById("modoEdicao").checked){
        document.querySelectorAll(".acoes").forEach(a=>{
            a.style.display = "flex";
        });
    }
}

async function excluirGasto(id){

    const confirmar = confirm("Tem certeza que deseja excluir este gasto?");

    if(!confirmar){
        return;
    }

    const { error } = await banco
        .from("gastos")
        .delete()
        .eq("id", id);

    if(error){
        alert("Erro ao excluir: " + error.message);
        console.log(error);
        return;
    }

    carregarGastos();
}

function atualizarGrafico(dados){

    const ctx = document.getElementById("grafico");

    const labels = Object.keys(dados);
    const valores = Object.values(dados);

    if(grafico){
        grafico.destroy();
    }

    grafico = new Chart(ctx, {
        type:"bar",
        data:{
            labels:labels,
            datasets:[{
                label:"Gastos",
                data:valores
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{display:false}
            },
            scales:{
                y:{
                    beginAtZero:true
                }
            }
        }
    });
}

carregarGastos();
</script>

</body>
</html>
