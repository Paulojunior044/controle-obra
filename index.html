<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GESTÃO DA OBRA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#f4f6f8;
    color:#111827;
}

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#111827,#1f2937);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.login-box h1{
    margin-bottom:8px;
    font-size:26px;
}

.login-box p{
    color:#6b7280;
    margin-bottom:20px;
}

.header{
    background:linear-gradient(135deg,#111827,#1f2937);
    color:white;
    padding:28px 20px;
}

.header-content{
    max-width:1180px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header h1{
    font-size:28px;
}

.btn-sair{
    background:#dc2626;
    color:white;
    padding:12px 18px;
}

.container{
    max-width:1180px;
    margin:auto;
    padding:24px 18px;
}

.dashboard{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:22px;
    padding:24px;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
    border:1px solid #e5e7eb;
}

.card h3{
    color:#6b7280;
    font-size:14px;
    font-weight:600;
}

.valor-principal{
    font-size:42px;
    font-weight:800;
    color:#16a34a;
    margin-top:10px;
}

.grid{
    display:grid;
    grid-template-columns:420px 1fr;
    gap:18px;
}

.box{
    background:white;
    padding:22px;
    border-radius:22px;
    box-shadow:0 8px 25px rgba(0,0,0,.06);
    border:1px solid #e5e7eb;
    margin-bottom:18px;
}

.box h2{
    margin-bottom:18px;
    font-size:20px;
}

.campo{
    margin-bottom:14px;
}

.campo label{
    display:block;
    font-size:14px;
    font-weight:700;
    color:#374151;
    margin-bottom:7px;
}

.campo input,
.campo select{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:14px;
    font-size:15px;
    outline:none;
}

.campo input:focus,
.campo select:focus{
    border-color:#16a34a;
    box-shadow:0 0 0 3px rgba(22,163,74,.12);
}

.linha{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.input-moeda{
    display:flex;
    border:1px solid #d1d5db;
    border-radius:14px;
    overflow:hidden;
}

.input-moeda span{
    background:#f3f4f6;
    padding:14px;
    font-weight:700;
}

.input-moeda input{
    border:none;
    border-radius:0;
}

.total-preview{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    background:#ecfdf5;
    border:1px solid #bbf7d0;
    border-radius:16px;
    margin-bottom:14px;
}

.total-preview strong{
    font-size:22px;
    color:#16a34a;
}

button{
    border:none;
    cursor:pointer;
    font-weight:700;
    border-radius:14px;
    transition:.2s;
}

.btn-salvar{
    width:100%;
    padding:16px;
    background:#16a34a;
    color:white;
    font-size:16px;
}

.btn-salvar:hover{
    background:#15803d;
}

.admin{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    gap:12px;
}

.admin label{
    font-weight:700;
    color:#374151;
}

.lista{
    max-height:650px;
    overflow:auto;
    padding-right:4px;
}

.item{
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:18px;
    margin-bottom:12px;
}

.item-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-start;
}

.produto{
    font-size:17px;
    font-weight:800;
}

.total{
    color:#16a34a;
    font-weight:800;
    white-space:nowrap;
}

.info{
    color:#6b7280;
    font-size:14px;
    margin-top:6px;
}

.detalhes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
}

.detalhe-card{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:12px;
}

.detalhe-card span{
    display:block;
    font-size:12px;
    color:#6b7280;
    margin-bottom:4px;
}

.detalhe-card strong{
    font-size:14px;
    color:#111827;
}

.observacao{
    margin-top:12px;
    background:#fefce8;
    border:1px solid #fde68a;
    color:#713f12;
    padding:12px;
    border-radius:12px;
    font-size:14px;
}

.tag{
    display:inline-block;
    background:#eef2ff;
    color:#4338ca;
    padding:5px 9px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    margin-top:10px;
}

.acoes{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
}

.btn-editar{
    padding:12px;
    background:#2563eb;
    color:white;
}

.btn-excluir{
    padding:12px;
    background:#dc2626;
    color:white;
}

canvas{
    width:100% !important;
    max-height:300px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    padding:20px;
}

.modal-content{
    max-width:520px;
    margin:40px auto;
    background:white;
    border-radius:24px;
    padding:24px;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.btn-cancelar{
    padding:14px;
    background:#e5e7eb;
    color:#111827;
}

.btn-atualizar{
    padding:14px;
    background:#16a34a;
    color:white;
}

h1,
h2,
h3,
label,
button,
.produto,
.tag,
.detalhe-card span,
.detalhe-card strong,
.total,
.valor-principal{
    text-transform:uppercase;
    letter-spacing:.5px;
}

#app{
    display:none;
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }

    .valor-principal{
        font-size:34px;
    }
}

@media(max-width:700px){
    .detalhes{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .header-content{
        flex-direction:column;
        align-items:flex-start;
    }

    .linha{
        grid-template-columns:1fr;
    }

    .container{
        padding:18px 12px;
    }

    .box,
    .card{
        border-radius:18px;
        padding:18px;
    }

    .item-top{
        flex-direction:column;
    }

    .total{
        font-size:18px;
    }

    .btn-sair{
        width:100%;
    }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h1>GESTÃO DA OBRA</h1>
        <p>Entre com seu e-mail e senha para acessar o sistema.</p>

        <div class="campo">
            <label>E-mail</label>
            <input id="emailLogin" type="email">
        </div>

        <div class="campo">
            <label>Senha</label>
            <input id="senhaLogin" type="password">
        </div>

        <button class="btn-salvar" onclick="entrar()">ENTRAR</button>
    </div>
</div>

<div id="app">

<div class="header">
    <div class="header-content">
        <div>
            <h1>GESTÃO DA OBRA</h1>
        </div>

        <button class="btn-sair" onclick="sair()">SAIR</button>
    </div>
</div>

<div class="container">

<div class="dashboard">
    <div class="card">
        <h3>TOTAL INVESTIDO</h3>
        <div class="valor-principal" id="totalGeral">R$ 0,00</div>
    </div>
</div>

<div class="grid">

<div class="box">
<h2>➕ NOVO LANÇAMENTO</h2>

<div class="campo">
    <label>Produto / Serviço</label>
    <input id="produto" type="text">
</div>

<div class="linha">
    <div class="campo">
        <label>Quantidade</label>
        <input id="quantidade" type="number" value="1">
    </div>

    <div class="campo">
        <label>Categoria</label>
        <select id="categoria"></select>
    </div>
</div>

<div class="campo">
    <label>Fornecedor</label>
    <input id="fornecedor" type="text">
</div>

<div class="campo">
    <label>Valor Unitário</label>
    <div class="input-moeda">
        <span>R$</span>
        <input id="valor" type="number" step="0.01">
    </div>
</div>

<div class="campo">
    <label>Observação</label>
    <input id="obs" type="text">
</div>

<div class="total-preview">
    <span>TOTAL DO ITEM</span>
    <strong id="totalItem">R$ 0,00</strong>
</div>

<button class="btn-salvar" onclick="salvarGasto()">SALVAR GASTO</button>
</div>

<div>
    <div class="box">
        <h2>📊 DISTRIBUIÇÃO DOS GASTOS</h2>
        <canvas id="grafico"></canvas>
    </div>

    <div class="box">
        <div class="admin">
            <h2>📋 HISTÓRICO DE GASTOS</h2>
            <label>
                <input type="checkbox" id="modoEdicao">
                Modo edição
            </label>
        </div>

        <div class="campo">
            <label>Pesquisar</label>
            <input id="pesquisa" type="text" placeholder="Digite qualquer palavra para buscar...">
        </div>

        <div class="lista" id="lista"></div>
    </div>
</div>

</div>
</div>

</div>

<div class="modal" id="modalEditar">
    <div class="modal-content">
        <h2>✏️ EDITAR GASTO</h2>

        <input type="hidden" id="editId">

        <div class="campo">
            <label>Produto / Serviço</label>
            <input id="editProduto" type="text">
        </div>

        <div class="linha">
            <div class="campo">
                <label>Quantidade</label>
                <input id="editQuantidade" type="number">
            </div>

            <div class="campo">
                <label>Categoria</label>
                <select id="editCategoria"></select>
            </div>
        </div>

        <div class="campo">
            <label>Fornecedor</label>
            <input id="editFornecedor" type="text">
        </div>

        <div class="campo">
            <label>Valor Unitário</label>
            <input id="editValor" type="number" step="0.01">
        </div>

        <div class="campo">
            <label>Observação</label>
            <input id="editObs" type="text">
        </div>

        <div class="modal-actions">
            <button class="btn-cancelar" onclick="fecharModal()">CANCELAR</button>
            <button class="btn-atualizar" onclick="atualizarGasto()">SALVAR ALTERAÇÃO</button>
        </div>
    </div>
</div>

<div class="modal" id="modalCategoria">
    <div class="modal-content">
        <h2>➕ CRIAR CATEGORIA</h2>

        <div class="campo">
            <label>Nome da categoria</label>
            <input id="novaCategoria" type="text" placeholder="Ex: Fundação, Acabamento, Telhado">
        </div>

        <div class="modal-actions">
            <button class="btn-cancelar" onclick="fecharModalCategoria()">CANCELAR</button>
            <button class="btn-atualizar" onclick="criarCategoria()">CRIAR</button>
        </div>
    </div>
</div>

<script>
const supabaseUrl = "https://sncqakvwubhlckncuuea.supabase.co";
const supabaseKey = "sb_publishable_4oEt-DgvoHZIlzwhlppjkQ_3NuY-UBn";
const banco = window.supabase.createClient(supabaseUrl, supabaseKey);

let grafico;
let gastosAtuais = [];
let categoriasAtuais = [];
let termoPesquisa = "";

async function verificarSessao(){
    const { data } = await banco.auth.getSession();

    if(data.session){
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "block";
        await iniciar();
    }else{
        document.getElementById("loginScreen").style.display = "flex";
        document.getElementById("app").style.display = "none";
    }
}

async function entrar(){
    const email = document.getElementById("emailLogin").value;
    const senha = document.getElementById("senhaLogin").value;

    if(!email || !senha){
        alert("Digite e-mail e senha.");
        return;
    }

    const { error } = await banco.auth.signInWithPassword({
        email: email,
        password: senha
    });

    if(error){
        alert("Erro ao entrar: " + error.message);
        return;
    }

    verificarSessao();
}

async function sair(){
    await banco.auth.signOut();

    document.getElementById("emailLogin").value = "";
    document.getElementById("senhaLogin").value = "";

    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("app").style.display = "none";
}

function moeda(valor){
    return Number(valor || 0).toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });
}

function calcularTotal(qtd, valor){
    return (Number(qtd) || 0) * (Number(valor) || 0);
}

function atualizarPreview(){
    const total = calcularTotal(
        document.getElementById("quantidade").value,
        document.getElementById("valor").value
    );

    document.getElementById("totalItem").innerText = moeda(total);
}

document.getElementById("quantidade").addEventListener("input", atualizarPreview);
document.getElementById("valor").addEventListener("input", atualizarPreview);

document.getElementById("pesquisa").addEventListener("input", function(){
    termoPesquisa = this.value.toLowerCase().trim();
    renderizarGastos();
});

document.getElementById("categoria").addEventListener("change", function(){
    if(this.value === "__nova__"){
        abrirModalCategoria();
        this.value = "";
    }
});

document.getElementById("editCategoria").addEventListener("change", function(){
    if(this.value === "__nova__"){
        abrirModalCategoria();
        this.value = "";
    }
});

document.getElementById("modoEdicao").addEventListener("change", function(){
    document.querySelectorAll(".acoes").forEach(a=>{
        a.style.display = this.checked ? "grid" : "none";
    });
});

async function carregarCategorias(){
    const { data, error } = await banco
        .from("categorias")
        .select("*")
        .order("nome", { ascending:true });

    if(error){
        alert("Erro ao carregar categorias: " + error.message);
        return;
    }

    categoriasAtuais = data || [];

    const selectCategoria = document.getElementById("categoria");
    const selectEditCategoria = document.getElementById("editCategoria");

    selectCategoria.innerHTML = `
        <option value="">Selecione</option>
        <option value="__nova__">+ Criar nova categoria</option>
    `;

    selectEditCategoria.innerHTML = `
        <option value="">Selecione</option>
        <option value="__nova__">+ Criar nova categoria</option>
    `;

    categoriasAtuais.forEach(cat=>{
        selectCategoria.innerHTML += `<option>${cat.nome}</option>`;
        selectEditCategoria.innerHTML += `<option>${cat.nome}</option>`;
    });
}

function abrirModalCategoria(){
    document.getElementById("novaCategoria").value = "";
    document.getElementById("modalCategoria").style.display = "block";
    setTimeout(()=>{
        document.getElementById("novaCategoria").focus();
    },100);
}

function fecharModalCategoria(){
    document.getElementById("modalCategoria").style.display = "none";
}

async function criarCategoria(){
    const nome = document.getElementById("novaCategoria").value.trim();

    if(!nome){
        alert("Digite o nome da categoria.");
        return;
    }

    const existe = categoriasAtuais.some(cat =>
        cat.nome.toLowerCase() === nome.toLowerCase()
    );

    if(existe){
        alert("Essa categoria já existe.");
        return;
    }

    const { error } = await banco
        .from("categorias")
        .insert([{ nome }]);

    if(error){
        alert("Erro ao criar categoria: " + error.message);
        return;
    }

    fecharModalCategoria();
    await carregarCategorias();

    document.getElementById("categoria").value = nome;
}

async function salvarGasto(){
    const produto = document.getElementById("produto").value;
    const quantidade = Number(document.getElementById("quantidade").value);
    const categoria = document.getElementById("categoria").value;
    const fornecedor = document.getElementById("fornecedor").value;
    const valorUnitario = Number(document.getElementById("valor").value);
    const observacao = document.getElementById("obs").value;
    const valorTotal = calcularTotal(quantidade, valorUnitario);

    if(!produto || !quantidade || !valorUnitario){
        alert("Preencha produto, quantidade e valor unitário.");
        return;
    }

    const { error } = await banco.from("gastos").insert([{
        produto,
        quantidade,
        categoria,
        fornecedor,
        valor_unitario: valorUnitario,
        valor_total: valorTotal,
        observacao,
        data_gasto: new Date().toISOString().split("T")[0]
    }]);

    if(error){
        alert("Erro ao salvar: " + error.message);
        return;
    }

    document.getElementById("produto").value = "";
    document.getElementById("quantidade").value = "1";
    document.getElementById("categoria").value = "";
    document.getElementById("fornecedor").value = "";
    document.getElementById("valor").value = "";
    document.getElementById("obs").value = "";

    atualizarPreview();
    carregarGastos();
}

async function carregarGastos(){
    const { data, error } = await banco
        .from("gastos")
        .select("*")
        .order("id", { ascending:false });

    if(error){
        alert("Erro ao carregar: " + error.message);
        return;
    }

    gastosAtuais = data || [];
    renderizarGastos();
}

function renderizarGastos(){
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    let totalGeral = 0;
    let porCategoria = {};

    const gastosFiltrados = gastosAtuais.filter(gasto => {
        const texto = `
            ${gasto.produto || ""}
            ${gasto.categoria || ""}
            ${gasto.fornecedor || ""}
            ${gasto.observacao || ""}
            ${gasto.quantidade || ""}
            ${gasto.valor_unitario || ""}
            ${gasto.valor_total || ""}
        `.toLowerCase();

        return texto.includes(termoPesquisa);
    });

    gastosFiltrados.forEach(gasto=>{
        totalGeral += Number(gasto.valor_total || 0);

        const categoria = gasto.categoria || "Sem categoria";
        porCategoria[categoria] = (porCategoria[categoria] || 0) + Number(gasto.valor_total || 0);

        lista.innerHTML += `
            <div class="item">
                <div class="item-top">
                    <div>
                        <div class="produto">${gasto.produto || "-"}</div>
                        <span class="tag">${categoria}</span>
                    </div>
                    <div class="total">${moeda(gasto.valor_total)}</div>
                </div>

                <div class="detalhes">
                    <div class="detalhe-card">
                        <span>Quantidade</span>
                        <strong>${gasto.quantidade}</strong>
                    </div>

                    <div class="detalhe-card">
                        <span>Valor Unitário</span>
                        <strong>${moeda(gasto.valor_unitario)}</strong>
                    </div>

                    <div class="detalhe-card">
                        <span>Fornecedor</span>
                        <strong>${gasto.fornecedor || "-"}</strong>
                    </div>
                </div>

                ${gasto.observacao ? `
                    <div class="observacao">
                        📝 ${gasto.observacao}
                    </div>
                ` : ""}

                <div class="acoes">
                    <button class="btn-editar" onclick="abrirEditar(${gasto.id})">EDITAR</button>
                    <button class="btn-excluir" onclick="excluirGasto(${gasto.id})">EXCLUIR</button>
                </div>
            </div>
        `;
    });

    if(gastosFiltrados.length === 0){
        lista.innerHTML = `
            <div class="item">
                <div class="produto">NENHUM GASTO ENCONTRADO</div>
                <div class="info">Tente pesquisar por outro termo.</div>
            </div>
        `;
    }

    document.getElementById("totalGeral").innerText = moeda(totalGeral);

    atualizarGrafico(porCategoria);

    if(document.getElementById("modoEdicao").checked){
        document.querySelectorAll(".acoes").forEach(a=>{
            a.style.display = "grid";
        });
    }
}

function atualizarGrafico(dados){
    const ctx = document.getElementById("grafico");
    const labels = Object.keys(dados);
    const valores = Object.values(dados);

    if(grafico){
        grafico.destroy();
    }

    grafico = new Chart(ctx, {
        type:"bar",
        data:{
            labels,
            datasets:[{
                label:"Gastos",
                data:valores,
                borderRadius:10
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{display:false}
            },
            scales:{
                y:{ beginAtZero:true }
            }
        }
    });
}

function abrirEditar(id){
    const gasto = gastosAtuais.find(g=>g.id === id);

    if(!gasto){
        alert("Gasto não encontrado.");
        return;
    }

    document.getElementById("editId").value = gasto.id;
    document.getElementById("editProduto").value = gasto.produto || "";
    document.getElementById("editQuantidade").value = gasto.quantidade || "";
    document.getElementById("editCategoria").value = gasto.categoria || "";
    document.getElementById("editFornecedor").value = gasto.fornecedor || "";
    document.getElementById("editValor").value = gasto.valor_unitario || "";
    document.getElementById("editObs").value = gasto.observacao || "";

    document.getElementById("modalEditar").style.display = "block";
}

function fecharModal(){
    document.getElementById("modalEditar").style.display = "none";
}

async function atualizarGasto(){
    const id = document.getElementById("editId").value;
    const produto = document.getElementById("editProduto").value;
    const quantidade = Number(document.getElementById("editQuantidade").value);
    const categoria = document.getElementById("editCategoria").value;
    const fornecedor = document.getElementById("editFornecedor").value;
    const valorUnitario = Number(document.getElementById("editValor").value);
    const observacao = document.getElementById("editObs").value;
    const valorTotal = calcularTotal(quantidade, valorUnitario);

    if(!produto || !quantidade || !valorUnitario){
        alert("Preencha produto, quantidade e valor unitário.");
        return;
    }

    const { error } = await banco
        .from("gastos")
        .update({
            produto,
            quantidade,
            categoria,
            fornecedor,
            valor_unitario: valorUnitario,
            valor_total: valorTotal,
            observacao
        })
        .eq("id", id);

    if(error){
        alert("Erro ao atualizar: " + error.message);
        return;
    }

    fecharModal();
    carregarGastos();
}

async function excluirGasto(id){
    if(!confirm("Tem certeza que deseja excluir este gasto?")){
        return;
    }

    const { error } = await banco
        .from("gastos")
        .delete()
        .eq("id", id);

    if(error){
        alert("Erro ao excluir: " + error.message);
        return;
    }

    carregarGastos();
}

async function iniciar(){
    atualizarPreview();
    await carregarCategorias();
    await carregarGastos();
}

verificarSessao();
</script>
